name: async-align

services:
  backend:
    build: .
    container_name: async-align-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/async_align
      DB_USERNAME: async_align
      DB_PASSWORD: async_align
      SERVER_PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes-minimum}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-configure-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-configure-google-client-secret}
      OAUTH2_SUCCESS_REDIRECT: ${OAUTH2_SUCCESS_REDIRECT:-http://localhost:3000/oauth/callback}
      CALENDAR_SUCCESS_REDIRECT: ${CALENDAR_SUCCESS_REDIRECT:-http://localhost:3000/settings/calendar}
      CALENDAR_TOKEN_ENCRYPTION_SECRET: ${CALENDAR_TOKEN_ENCRYPTION_SECRET:-local-calendar-token-secret-change-me}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      UPLOAD_ROOT: /app/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - async-align-uploads:/app/data/uploads

  postgres:
    image: postgres:17-alpine
    container_name: async-align-postgres
    environment:
      POSTGRES_DB: async_align
      POSTGRES_USER: async_align
      POSTGRES_PASSWORD: async_align
    ports:
      - "5432:5432"
    volumes:
      - async-align-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U async_align -d async_align"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  async-align-postgres-data:
  async-align-uploads:
