spring:
  application:
    name: async-align-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/async_align}
    username: ${DB_USERNAME:async_align}
    password: ${DB_PASSWORD:async_align}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            # Non-empty defaults keep local email/JWT development bootable.
            # Replace both values with credentials from Google Cloud Console.
            client-id: ${GOOGLE_CLIENT_ID:configure-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
            scope: openid,profile,email

server:
  port: ${SERVER_PORT:8080}

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth2:
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/oauth/callback}
  email-verification:
    required: ${EMAIL_VERIFICATION_REQUIRED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-ttl: PT10M
    resend-cooldown: PT1M
  storage:
    root: ${UPLOAD_ROOT:./data/uploads}
    public-path: /uploads
  calendar:
    token-encryption-secret: ${CALENDAR_TOKEN_ENCRYPTION_SECRET:${JWT_SECRET:local-calendar-token-secret-change-me}}
    success-redirect: ${CALENDAR_SUCCESS_REDIRECT:http://localhost:3000/settings/calendar}

# Configure these environment variables to enable the Google button:
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
