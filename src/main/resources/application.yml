spring:
  application:
    name: async-align-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/async_align}
    username: ${DB_USERNAME:async_align}
    password: ${DB_PASSWORD:async_align}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_0
  packages-to-scan: com.likelion.asyncalign
  paths-to-match: /api/v1/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  email-verification:
    required: ${EMAIL_VERIFICATION_REQUIRED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-ttl: PT10M
    resend-cooldown: PT1M
  storage:
    root: ${UPLOAD_ROOT:./data/uploads}
    public-path: /uploads
  ai:
    ditto:
      enabled: ${DITTO_AI_ENABLED:false}
      base-url: ${DITTO_AI_BASE_URL:http://localhost:8000}
      internal-api-key: ${DITTO_INTERNAL_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
