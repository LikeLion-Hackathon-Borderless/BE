spring:
  application:
    name: async-align-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/async_align}
    username: ${DB_USERNAME:async_align}
    password: ${DB_PASSWORD:async_align}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
